name: ByToBy Auto Stock Alerts

on:
  schedule:
    # التشغيل كل 30 دقيقة خلال أيام التداول من الإثنين للجمعة
    - cron: '*/30 13-21 * * 1-5'
  workflow_dispatch: # يتيح لك التشغيل اليدوي من الموقع للاختبار

jobs:
  check-stocks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance requests pandas

      - name: Run Stock Alert Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python backend/services/auto_alert_runner.py
